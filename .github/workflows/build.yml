name: Build plugins
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lv2: 'ON'
          - os: windows-latest
            lv2: 'OFF'
          - os: macos-latest
            lv2: 'OFF'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build and validation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxrender-dev libgl1-mesa-dev liblilv-dev xvfb xauth
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEQ29_BUILD_VST2=ON -DEQ29_BUILD_LV2=${{ matrix.lv2 }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test DSP and native plugin loading/state/audio
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test embedded Linux editors and automation
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24 +extension GLX' ./build/eq29_vst2_tests "$PWD/build/bin/my_dynamic_eq-vst2.so" --ui
          xvfb-run -a -s '-screen 0 1280x900x24 +extension GLX' ./build/eq29_lv2_tests "$PWD/build/bin/my_dynamic_eq.lv2/" --ui
      - name: Validate installation
        run: cmake --install build --config Release --prefix stage
      - uses: actions/upload-artifact@v4
        with:
          name: eq29-${{ runner.os }}-${{ runner.arch }}
          path: build/bin/
          if-no-files-found: error
