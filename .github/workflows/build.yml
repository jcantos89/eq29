name: Build plugins
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            lv2: 'ON'
          - os: windows-latest
            lv2: 'ON'
          - os: macos-latest
            lv2: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build and validation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxrender-dev libgl1-mesa-dev liblilv-dev xvfb xauth
      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEQ29_BUILD_VST2=ON -DEQ29_BUILD_VST3=ON -DEQ29_BUILD_LV2=${{ matrix.lv2 }}
      - name: Configure macOS universal LV2, VST2 and VST3
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEQ29_BUILD_LV2=ON -DEQ29_BUILD_VST2=ON -DEQ29_BUILD_VST3=ON '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if cmake --build build --config Release --parallel 2 2>&1 | tee build/build.log; then
            exit 0
          else
            result=$?
            cmake -DLOG_FILE=build/build.log -DSTAGE=Build -P scripts/report-ci-failure.cmake
            exit "$result"
          fi
      - name: Test DSP and native plugin loading/state/audio
        shell: bash
        run: |
          set -o pipefail
          if ctest --test-dir build -C Release --output-on-failure 2>&1 | tee build/test.log; then
            exit 0
          else
            result=$?
            cmake -DLOG_FILE=build/test.log -DSTAGE=Tests -P scripts/report-ci-failure.cmake
            exit "$result"
          fi
      - name: Test embedded Linux editors and automation
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24 +extension GLX' ./build/eq29_vst2_tests "$PWD/build/bin/my_dynamic_eq-vst2.so" --ui
          xvfb-run -a -s '-screen 0 1280x900x24 +extension GLX' ./build/eq29_vst3_tests "$PWD/build/bin/my_dynamic_eq_vst3.vst3/Contents/x86_64-linux/my_dynamic_eq_vst3.so" --ui
          xvfb-run -a -s '-screen 0 1280x900x24 +extension GLX' ./build/eq29_lv2_tests "$PWD/build/bin/my_dynamic_eq.lv2/" --ui
      - name: Validate installation
        run: cmake --install build --config Release --prefix stage
      - uses: actions/upload-artifact@v6
        with:
          name: eq29-1.1.0-${{ runner.os }}-${{ runner.os == 'macOS' && 'universal' || runner.arch }}
          path: build/bin/
          if-no-files-found: error

      - name: Upload diagnostic logs even when a job fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eq29-logs-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/build.log
            build/test.log
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
